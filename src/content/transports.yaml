# ── 1. ARRIVER EN CORÉE ───────────────────────────────────────
arriver:
  title: "Arriver en Corée"
  text: "Les vols depuis la France arrivent à l’aéroport international d’Incheon (ICN), à environ une heure de Séoul. Trois options pour rejoindre la ville :"
  options:
    - name: "AREX"
      korean: "공항철도"
      tagline: "Le train de l’aéroport"
      recommended: true
      duration: "≈ 45 min à 1 h"
      price: "≈ 4 500 à 13 000 ₩"
      pros:
        - "Rapide et ponctuel, sans embouteillages"
        - "Le train express relie l’aéroport à la gare de Séoul sans arrêt"
        - "Correspondances faciles avec le métro"
      info: "Deux trains : l’express, direct jusqu’à la gare de Séoul en 45 min environ (≈ 11 000 à 13 000 ₩, billet à acheter au guichet ou en ligne), et le train omnibus, payable avec la carte T-money, qui dessert d’autres stations en 1 h environ (≈ 4 500 à 5 000 ₩). Suivez les panneaux « Train to Seoul » dans le hall des arrivées. Tarifs indicatifs, à vérifier sur le site d’AREX."
    - name: "Bus de l’aéroport"
      korean: "공항 리무진 버스"
      tagline: "Limousine bus"
      duration: "≈ 1 h à 1 h 30"
      price: "≈ 17 000 à 18 000 ₩"
      pros:
        - "Dépose près de nombreux hôtels"
        - "Sièges confortables, bagages en soute"
        - "Pratique avec de grosses valises"
      info: "Billets aux comptoirs et bornes du hall des arrivées. Chaque ligne dessert un quartier : indiquez le nom de votre hôtel ou de votre quartier au comptoir. La durée dépend de la circulation."
    - name: "Taxi"
      korean: "택시"
      tagline: "Le plus simple, de porte à porte"
      duration: "≈ 1 h à 1 h 30"
      price: "≈ 60 000 à 100 000 ₩ + péage"
      pros:
        - "Idéal à plusieurs ou tard le soir"
        - "Aucune correspondance"
        - "Paiement par carte accepté"
      info: "File d’attente officielle à la sortie du terminal. Ayez l’adresse de votre hôtel en coréen. Majoration la nuit. Les taxis noirs (« deluxe ») sont plus chers."

# ── 2. SE DÉPLACER À SÉOUL ────────────────────────────────────
seDeplacer:
  title: "Se déplacer à Séoul"
  text: "Séoul est l’une des villes les plus faciles à parcourir : propre, sûre et très bien desservie."
  highlight:
    title: "La carte T-money"
    korean: "티머니"
    text: "Une carte rechargeable à utiliser partout : métro, bus, taxis et même supérettes. Achetez-la dès votre arrivée dans une supérette (GS25, CU, 7-Eleven) ou à l’aéroport, puis rechargez-la en espèces aux bornes du métro ou en caisse."
    tips:
      - "Badgez en entrant et en sortant (métro et bus), pour bénéficier des correspondances à tarif réduit."
      - "Une carte par personne."
      - "La recharge se fait généralement en espèces : prévoyez quelques billets de 10 000 ₩."
    # Écran du lecteur de carte (bus et métro)
    reader:
      title: "Lire l’écran du lecteur"
      text: "À chaque passage de la carte, le lecteur affiche deux lignes :"
      lines:
        - korean: "요금"
          amount: "1 550 ₩"
          label: "le prix payé pour ce trajet"
        - korean: "잔액"
          amount: "8 450 ₩"
          label: "ce qui reste sur votre carte"
      note: "Quand une correspondance est appliquée, une voix annonce « hwanseung-imnida » (환승입니다)."
  modes:
    - name: "Métro"
      icon: "metro"
      text: "Rapide, fréquent et indiqué en anglais. Chaque ligne a une couleur et chaque station un numéro."
      detail: "Trajet à partir de 1 550 ₩ avec la carte"
    - name: "Bus"
      icon: "bus"
      text: "Très complet mais moins intuitif pour une première visite. Les applications de cartes indiquent le bon numéro et l’arrêt."
      detail: "Montez par l’avant, badgez aussi en descendant"
    - name: "Taxi"
      icon: "taxi"
      text: "Nombreux et abordables comparés à la France. La plupart des chauffeurs parlent peu anglais : montrez l’adresse en coréen."
      detail: "Prise en charge à partir d’environ 4 800 ₩"
  # Manger et boire dans les transports
  etiquette:
    title: "Manger et boire à bord"
    items:
      - label: "Bus"
        text: "À Séoul, le chauffeur peut refuser l’accès avec un gobelet ou de la nourriture à emporter. Finissez votre café avant de monter."
      - label: "Métro"
        text: "Ce n’est pas interdit par la loi, mais très mal vu : évitez de manger dans le métro, une bouteille d’eau fermée ne pose aucun problème."
      - label: "Train (KTX)"
        text: "Vous pouvez manger et boire à votre place, en restant discret."
  # Places réservées dans le métro
  seats:
    title: "Les places réservées"
    text: "Dans le métro coréen, certaines places restent libres même quand la rame est bondée. L’usage est de ne pas s’y asseoir, même si personne n’attend."
    items:
      - label: "Siège rose"
        korean: "임산부 배려석"
        text: "Réservé aux femmes enceintes. On le laisse vide : une future maman n’ose pas toujours demander, et sa grossesse ne se voit pas forcément."
      - label: "Sièges prioritaires"
        korean: "노약자석"
        text: "Les petites banquettes aux extrémités de chaque voiture sont pour les personnes âgées ou handicapées, les femmes enceintes et les parents avec de jeunes enfants."
  apps:
    title: "Applications utiles"
    items:
      - name: "Naver Map"
        text: "Itinéraires précis à pied et en transports (en anglais)."
      - name: "Kakao Map"
        text: "Alternative très fiable à Naver Map."
      - name: "Kakao T"
        text: "Pour commander un taxi, comme Uber."
      - name: "Papago"
        text: "Traduction, y compris des menus et panneaux en photo."
    note: "Google Maps fonctionne mal en Corée pour les itinéraires : préférez Naver Map ou Kakao Map."

# ── 3. VENIR AU MARIAGE ──────────────────────────────────────
venirAuMariage:
  title: "Venir au mariage"
  text: "La cérémonie a lieu à Bella Luce, dans la salle Floche (플로체홀) au 7e étage, à deux pas de la station Hoegi (회기역)."
  station:
    name: "Station Hoegi"
    korean: "회기역"
    lines: "Ligne 1 (n° 123) · Gyeongui–Jungang (K118) · Gyeongchun"
    walk: "Sortie 2 (2번 출구), puis environ 170 m à pied, soit 2 à 3 minutes."
  routes:
    - id: "aeroport"
      label: "Aéroport"
      duration: "≈ 1 h 30"
      steps:
        - title: "AREX jusqu’à la gare de Séoul"
          text: "Prenez l’AREX depuis l’aéroport d’Incheon jusqu’au terminus, la gare de Séoul (서울역)."
        - title: "Ligne 1 jusqu’à Hoegi (123)"
          text: "Changez pour la ligne 1 (bleu foncé), direction Cheongnyangni / Uijeongbu, et descendez à Hoegi (회기역)."
        - title: "Sortie 2, puis 170 m à pied"
          text: "Bella Luce est à 2 ou 3 minutes de marche. Montez au 7e étage, salle Floche."
      alternative: "En taxi, comptez environ 1 h à 1 h 30 selon la circulation."
    - id: "centre"
      label: "Centre-ville"
      duration: "≈ 30 à 45 min"
      steps:
        - title: "Ligne 1 jusqu’à Hoegi (123)"
          text: "Depuis la gare de Séoul, City Hall, Jonggak, Jongno 3-ga ou Dongdaemun, la ligne 1 mène directement à Hoegi (회기역), direction Cheongnyangni / Uijeongbu."
        - title: "Sortie 2, puis 170 m à pied"
          text: "Bella Luce est à 2 ou 3 minutes de marche. Montez au 7e étage, salle Floche."
      alternative: "En taxi depuis Myeongdong ou Jongno, comptez environ 30 à 40 min."
    - id: "hotels"
      label: "Votre hôtel"
      duration: "Selon le quartier"
      steps:
        - title: "Gangnam"
          text: "Ligne 2 (verte) jusqu’à Wangsimni (왕십리), puis ligne Gyeongui–Jungang (turquoise), direction Yongmun / Deokso : Hoegi est à deux stations, après Cheongnyangni."
        - title: "Myeongdong"
          text: "Ligne 4 (bleu ciel) jusqu’à Dongdaemun (동대문), puis ligne 1 direction Cheongnyangni / Uijeongbu jusqu’à Hoegi."
        - title: "Jongno / Insadong / Dongdaemun"
          text: "Ligne 1 directement depuis Jonggak, Jongno 3-ga, Jongno 5-ga ou Dongdaemun, jusqu’à Hoegi."
        - title: "Itaewon"
          text: "Ligne 6 (ocre) jusqu’à Dongmyo (동묘앞), puis ligne 1 direction Cheongnyangni / Uijeongbu jusqu’à Hoegi."
        - title: "Hongdae / Mapo"
          text: "Ligne 2 (verte) jusqu’à City Hall (시청), puis ligne 1 jusqu’à Hoegi. Certains trains de la ligne Gyeongui–Jungang vont aussi directement de Hongik University à Hoegi : vérifiez la destination affichée."
        - title: "Yongsan"
          text: "Ligne Gyeongui–Jungang depuis Yongsan (용산), direction Yongmun / Cheongnyangni, jusqu’à Hoegi."
      alternative: "Le plus simple : tapez « 회기역 » ou « 벨라루체웨딩홀 » dans Naver Map pour l’itinéraire exact depuis votre hôtel."
  taxi:
    title: "En taxi"
    text: "Le jour J, le taxi reste l’option la plus confortable, surtout en tenue de cérémonie. Montrez simplement l’adresse ci-dessous au chauffeur."
  arrivalTitle: "À l’arrivée"
  arrival:
    - "Rendez-vous au 7e étage, dans la salle Floche (플로체홀)."
    - "Merci d’arriver 10 à 30 minutes avant le début de la cérémonie (17h30)."
    - "La cérémonie dure environ une heure et sera suivie d’un buffet."

# ── 4. ENTRE LES RÉGIONS ─────────────────────────────────────
entreRegions:
  title: "Entre les régions"
  text: "Pour prolonger le voyage à Busan, Gyeongju, Jeonju, Gangneung ou Jeju, la Corée se parcourt très facilement en train rapide, en bus express ou en avion."
  options:
    - name: "KTX & SRT"
      korean: "고속열차"
      tagline: "Le train à grande vitesse"
      recommended: true
      duration: "Busan ≈ 2 h 30"
      price: "Busan ≈ 55 000 à 60 000 ₩"
      pros:
        - "Busan, Gyeongju (gare de Singyeongju), Jeonju et Gangneung en 1 h 30 à 2 h 30"
        - "Confortable, ponctuel, centre-ville à centre-ville"
        - "Départs de la gare de Séoul, de Yongsan ou de Suseo (Gangnam) ; pour Gangneung, aussi de Cheongnyangni, à une station de Hoegi"
      info: "Depuis septembre 2026, KTX et SRT sont réunis : tous les trains se réservent au même endroit, sur le site ou l’application de Korail. La carte T-money ne fonctionne pas pour ces trains."
    - name: "Bus express"
      korean: "고속버스"
      tagline: "Économique et très fréquent"
      duration: "Jeonju ≈ 2 h 30"
      price: "Moins cher que le train"
      pros:
        - "Dessert presque toutes les villes"
        - "Sièges « premium » très confortables"
        - "Idéal pour Jeonju"
      info: "Départs principalement de l’Express Bus Terminal (Gangnam) et de Dong Seoul. Billets en gare routière, aux bornes ou en ligne."
    - name: "Avion"
      korean: "국내선"
      tagline: "Indispensable pour Jeju"
      duration: "Jeju ≈ 1 h 10"
      price: "Variable selon la date"
      pros:
        - "Vols très fréquents vers Jeju"
        - "Plusieurs compagnies, dont des low-cost"
        - "Départ de l’aéroport de Gimpo, proche de Séoul"
      info: "Les vols intérieurs partent de Gimpo (GMP), et non d’Incheon. Gimpo est relié au centre par le métro et l’AREX. Réservez tôt en été."
  booking:
    title: "Réserver son train"
    steps:
      - title: "Sur le site de Korail, en anglais"
        text: "Le site officiel de Korail permet d’acheter un billet KTX avec une adresse e-mail, votre passeport et une carte bancaire."
      - title: "Ou sur l’application Korail+"
        text: "L’application officielle (anciennement Korail Talk) permet de réserver KTX et SRT au même endroit, et de garder son billet sur le téléphone."
      - title: "Pensez au Korail Pass"
        text: "Réservé aux visiteurs étrangers, il offre des trajets illimités pendant 2 à 5 jours. Pratique si vous enchaînez plusieurs villes."
      - title: "Réservez à l’avance"
        text: "Les week-ends et l’été, les trains se remplissent vite : réservez dès que possible. Aux bornes des gares, les menus existent aussi en anglais."
    note: "Le lundi 16 août 2027 devrait être férié (la fête de la Libération, le 15 août, tombe un dimanche) : le week-end du mariage sera un long week-end très chargé. Réservez trains et hôtels le plus tôt possible."
    links:
      - label: "Korail (KTX et SRT)"
        url: "https://www.letskorail.com"
