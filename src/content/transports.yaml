pageTitle: "Transports"
intro: "Tout ce qu’il faut savoir pour arriver en Corée, circuler à Séoul et nous rejoindre le jour J."
disclaimer: "Durées et tarifs donnés à titre indicatif — à vérifier avant le départ."

# Petits liens en haut de page (ancres vers chaque section)
sections:
  - id: "arriver"
    label: "Arriver"
  - id: "se-deplacer"
    label: "Se déplacer"
