# ─────────────────────────────────────────────────────────────
#  Page Hôtels
#
#  Les hôtels sont regroupés par quartier. Pour ajouter un hôtel,
#  copiez un bloc « - name: … » dans la liste « hotels » du quartier
#  et remplissez les champs.
#
#  Champs d'un hôtel :
#    name        : nom de l'hôtel
#    image       : photo (chemin à partir de src/assets/), ex. "hotels/01.jpg"
#    description : une ou deux phrases
#    price       : "€", "€€" ou "€€€" (voir la légende plus bas)
#    transport   : station la plus proche / temps jusqu'au mariage
#    url         : lien vers le site de l'hôtel ou de réservation
#
#  Tant qu'un nom commence par « À compléter », la carte s'affiche
#  comme provisoire.
# ─────────────────────────────────────────────────────────────

pageTitle: "Hôtels"
intro: "Notre sélection d’hôtels, quartier par quartier, pour choisir l’ambiance qui vous ressemble."
note: "La liste des hôtels sera bientôt complétée."

