# Page d'accueil du Carnet de voyage
pageTitle: "Carnet de voyage"
intro: "Le mariage est aussi l’occasion de découvrir la Corée. Voici nos coups de cœur, de Séoul à l’île de Jeju."
mapHint: "Touchez une ville pour ouvrir sa page."
foodTitle: "Et pour se régaler"

# « La Corée en bref » : informations pratiques générales.
# ⚠️ Taux de change et formalités évoluent : à vérifier avant le départ.
bref:
  title: "La Corée en bref"
  text: "Quelques repères pour arriver serein."
  items:
    - icon: "won"
      title: "La monnaie"
      text: "Le won (₩). En 2026, 1 € valait environ 1 600 à 1 800 ₩ : un café coûte autour de 5 000 ₩, un repas simple 10 000 à 15 000 ₩."
    - icon: "card"
      title: "Payer"
      text: "La carte bancaire est acceptée presque partout, même pour un café. Gardez un peu d’espèces pour les marchés et la recharge de la carte T-money."
    - icon: "clock"
      title: "Le décalage horaire"
      text: "+7 heures par rapport à la France en été (+8 h en hiver). Quand il est midi à Paris, il est 19 h à Séoul."
    - icon: "plane"
      title: "Les formalités"
      text: "Pas de visa pour un séjour touristique de moins de 90 jours avec un passeport français. La France est dispensée d’autorisation en ligne (K-ETA) jusqu’à fin 2026 ; si cette dispense n’est pas prolongée, il faudra la demander sur le site officiel k-eta.go.kr (≈ 10 000 ₩), au moins 72 h avant le départ. Nous mettrons cette page à jour."
    - icon: "phone"
      title: "Internet"
      text: "Le Wi-Fi est partout et très rapide. Une eSIM ou une carte SIM locale achetée à l’aéroport rend le séjour bien plus simple (cartes, traduction, taxis)."
    - icon: "heart"
      title: "L’électricité"
      text: "Les mêmes prises qu’en France (220 V) : pas besoin d’adaptateur."
    - icon: "pin"
      title: "Le climat en août"
      text: "Chaud et humide, souvent plus de 30 °C, avec quelques averses. Tenue légère, crème solaire et petit parapluie."
    - icon: "rings"
      title: "Sécurité et urgences"
      text: "La Corée est un pays très sûr. Police : 112. Pompiers et ambulance : 119. Ligne d’information touristique (en anglais et autres langues) : 1330."

  culture:
    title: "Quelques codes culturels"
    items:
      - "On salue en inclinant légèrement la tête ; on donne et reçoit les objets à deux mains."
      - "Le respect des aînés est important : on attend souvent que la personne la plus âgée commence à manger."
      - "On retire ses chaussures à l’entrée des maisons et de certains restaurants traditionnels où l’on mange assis au sol."
      - "Dans le métro, on parle à voix basse ; le siège rose est réservé aux femmes enceintes, et les banquettes en bout de voiture aux personnes âgées ou à mobilité réduite (voir la page Transports)."
      - "Le pourboire ne se pratique pas."

  mots:
    title: "Quelques mots utiles"
    items:
      - fr: "Bonjour"
        ko: "안녕하세요"
        say: "an-nyeong-ha-sé-yo"
      - fr: "Merci"
        ko: "감사합니다"
        say: "kam-sa-ham-ni-da"
      - fr: "Excusez-moi ! (pour appeler)"
        ko: "저기요"
        say: "djo-gi-yo"
      - fr: "C’est combien ?"
        ko: "얼마예요?"
        say: "eol-ma-yé-yo"
      - fr: "C’est délicieux !"
        ko: "맛있어요"
        say: "ma-shi-sseo-yo"
      - fr: "Santé !"
        ko: "건배"
        say: "keon-bè"
