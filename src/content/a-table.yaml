# ─────────────────────────────────────────────────────────────
#  Page « À table » (Carnet de voyage) : manger et boire en Corée.
#  Les spécialités régionales sont reprises automatiquement depuis
#  les pages des villes (rubrique « À goûter »).
# ─────────────────────────────────────────────────────────────

title: "À table !"
korean: "맛있게 드세요"
tagline: "Manger et boire en Corée"
cardText: "Les plats à goûter, les codes à table, la culture des cafés et les spécialités de chaque région."
hero: "food/hero-banchan.jpg"
intro: "En Corée, la table est un moment de partage : on pose tout au centre, on se sert les uns les autres et l’on goûte à tout. Voici de quoi vous y retrouver."

codes:
  title: "Les codes à table"
  items:
    - title: "Tout se partage"
      text: "Les plats sont posés au centre et chacun pioche. Les petits accompagnements (banchan) sont offerts et resservis gratuitement."
    - title: "L’eau est en libre-service"
      text: "Elle est gratuite, souvent dans une carafe à table ou à une fontaine près de l’entrée."
    - title: "Baguettes et cuillère"
      text: "Souvent rangées dans un tiroir sous la table. La cuillère sert pour le riz et la soupe."
    - title: "Une sonnette pour appeler"
      text: "Beaucoup de tables ont un petit bouton pour appeler le serveur. Sinon, un « Jeogiyo ! » (저기요) suffit."
    - title: "On paie à la caisse"
      text: "En partant, à la caisse près de la porte. Les cartes bancaires sont acceptées partout."
    - title: "Pas de pourboire"
      text: "Le pourboire ne se pratique pas en Corée."
    - title: "Deux portions minimum"
      text: "Pour le barbecue et certains plats à partager, beaucoup de restaurants demandent de commander au moins deux portions."

plats:
  title: "Les plats à goûter"
  text: "La cuisine coréenne va bien au-delà du barbecue. Voici, par famille, ce que nous vous conseillons de goûter."
  categories:
    - title: "Au barbecue"
      items:
        - name: "Samgyeopsal"
          photo: "food/samgyeopsal.jpg"
          korean: "삼겹살"
          text: "Poitrine de porc grillée à table, à envelopper dans une feuille de salade avec ail et sauce."
        - name: "Galbi"
          photo: "food/galbi.jpg"
          korean: "갈비"
          text: "Côtes marinées grillées au charbon : de bœuf (so galbi) ou de porc (dwaeji galbi), plus abordable et tout aussi délicieux."
        - name: "Bulgogi"
          photo: "food/bulgogi.jpg"
          korean: "불고기"
          text: "Bœuf finement tranché et mariné, sucré-salé, idéal pour commencer en douceur."
        - name: "Dakgalbi"
          photo: "food/dakgalbi.jpg"
          korean: "닭갈비"
          text: "Poulet sauté au piment avec chou et gâteaux de riz, cuit sur une grande plaque au centre de la table."

    - title: "Riz et plats du quotidien"
      items:
        - name: "Bibimbap"
          photo: "food/bibimbap.jpg"
          korean: "비빔밥"
          text: "Riz, légumes, œuf et pâte de piment, à mélanger soi-même. Délicieux en bol de pierre brûlant (dolsot)."
        - name: "Kimbap"
          photo: "food/kimbap.jpg"
          korean: "김밥"
          text: "Rouleaux de riz et d’algue garnis de légumes, d’œuf ou de thon : parfaits pour un pique-nique ou un train."
        - name: "Kimchi bokkeumbap"
          photo: "food/kimchi-bokkeumbap.jpg"
          korean: "김치볶음밥"
          text: "Riz sauté au kimchi, souvent surmonté d’un œuf au plat."
        - name: "Mandu"
          photo: "food/mandu.jpg"
          korean: "만두"
          text: "Raviolis à la vapeur ou grillés, farcis de viande, de légumes ou de kimchi."

    - title: "Soupes et ragoûts"
      items:
        - name: "Kimchi jjigae"
          photo: "food/kimchi-jjigae.jpg"
          korean: "김치찌개"
          text: "Le ragoût au kimchi et au porc, plat réconfortant par excellence."
        - name: "Sundubu jjigae"
          photo: "food/sundubu.jpg"
          korean: "순두부찌개"
          text: "Tofu soyeux dans un bouillon pimenté, servi bouillonnant avec un œuf cru à casser dedans."
        - name: "Budae jjigae"
          photo: "food/budae-jjigae.jpg"
          korean: "부대찌개"
          text: "Le « ragoût de l’armée » : saucisses, jambon, nouilles et kimchi, à partager."
        - name: "Seolleongtang"
          photo: "food/seolleongtang.jpg"
          korean: "설렁탕"
          text: "Bouillon d’os de bœuf, blanc et doux, à saler soi-même à table."

    - title: "Nouilles"
      items:
        - name: "Jajangmyeon"
          photo: "food/jajangmyeon.jpg"
          korean: "짜장면"
          text: "Nouilles à la sauce de haricots noirs, star de la cuisine sino-coréenne."
        - name: "Jjamppong"
          photo: "food/jjamppong.jpg"
          korean: "짬뽕"
          text: "Soupe de nouilles aux fruits de mer, rouge et relevée."
        - name: "Kalguksu"
          photo: "food/kalguksu.jpg"
          korean: "칼국수"
          text: "Nouilles coupées au couteau dans un bouillon doux."
        - name: "Ramyeon"
          korean: "라면"
          text: "Les nouilles instantanées, véritable institution : à essayer au moins une fois… en supérette."

    - title: "Le soir, entre amis"
      items:
        - name: "Le poulet frit"
          photo: "food/poulet-frit.jpg"
          korean: "치킨"
          text: "Croustillant nature, ou laqué d’une sauce sucrée-pimentée (yangnyeom). Avec une bière, c’est le « chimaek »."
        - name: "Jokbal"
          photo: "food/jokbal.jpg"
          korean: "족발"
          text: "Pied de porc braisé au soja et aux épices, servi tranché, fondant et parfumé."
        - name: "Bossam"
          photo: "food/bossam.jpg"
          korean: "보쌈"
          text: "Porc bouilli tranché, à envelopper dans du chou avec du kimchi frais."
        - name: "Haemul pajeon"
          photo: "food/haemul-pajeon.jpg"
          korean: "해물파전"
          text: "Grande galette aux oignons verts et fruits de mer, l’alliée du makgeolli, surtout les jours de pluie."

    - title: "Street food"
      items:
        - name: "Tteokbokki"
          photo: "food/tteokbokki.jpg"
          korean: "떡볶이"
          text: "Gâteaux de riz dans une sauce pimentée, la star des stands de rue."
        - name: "Eomuk"
          photo: "food/eomuk.jpg"
          korean: "어묵"
          text: "Brochettes de galettes de poisson dans un bouillon chaud, à boire à la tasse."
        - name: "Twigim"
          photo: "food/twigim.jpg"
          korean: "튀김"
          text: "Beignets de légumes, de calamars ou d’œufs, à tremper dans la sauce du tteokbokki."
        - name: "Corn dog coréen"
          photo: "food/corn-dog.jpg"
          korean: "핫도그"
          text: "Saucisse ou mozzarella dans une pâte croustillante, roulée dans le sucre : étonnant et addictif."

    - title: "Côté sucré"
      items:
        - name: "Hotteok"
          photo: "food/hotteok.jpg"
          korean: "호떡"
          text: "Petite crêpe épaisse fourrée de sucre brun et de graines, servie brûlante."
        - name: "Bungeoppang"
          photo: "food/bungeoppang.jpg"
          korean: "붕어빵"
          text: "Gaufre en forme de poisson fourrée à la pâte de haricot rouge (plutôt en hiver)."
        - name: "Les boulangeries coréennes"
          korean: "베이커리"
          text: "Pains très moelleux, gâteaux crème et fruits : les boulangeries-cafés sont partout."

  # Les supérettes
  superettes:
    title: "La culture des supérettes"
    photo: "food/superette.jpg"
    text: "GS25, CU, 7-Eleven… On en trouve à chaque coin de rue, souvent ouvertes 24 h/24. On y achète des triangles de riz (samgak gimbap), des ramyeon à préparer sur place avec l’eau chaude en libre-service, des glaces et des boissons — et l’on s’installe aux petites tables devant la porte, les soirs d’été."

ete:
  title: "En plein mois d’août"
  text: "Le mariage tombe en plein été coréen, chaud et humide. Voici ce que mangent les Coréens pour se rafraîchir… ou reprendre des forces."
  items:
    - name: "Naengmyeon"
      photo: "food/naengmyeon.jpg"
      korean: "냉면"
      text: "Nouilles froides dans un bouillon glacé."
    - name: "Bingsu"
      photo: "food/bingsu.jpg"
      korean: "빙수"
      text: "Glace pilée garnie de fruits, de haricot rouge ou de lait, à partager."
    - name: "Samgyetang"
      photo: "food/samgyetang.jpg"
      korean: "삼계탕"
      text: "Petit poulet farci au riz et au ginseng, servi brûlant les jours les plus chauds de l’été, selon la tradition."

cafes:
  title: "La culture des cafés"
  text: "La Corée compte un nombre impressionnant de cafés, souvent très soignés : on y vient autant pour le décor que pour le café ou les desserts."
  tips:
    - "On commande au comptoir, et l’usage est de prendre une boisson par personne."
    - "Les cafés servent rarement de l’alcool : pour un verre, direction un bar ou un restaurant."
    - "Beaucoup ouvrent tard, et les cafés-boulangeries sont parfaits pour le petit-déjeuner."
  # Les grandes chaînes de cafés coréennes (une ligne par chaîne)
  chains:
    title: "Les chaînes coréennes"
    text: "Au-delà de Starbucks, la Corée a ses propres chaînes, présentes à chaque coin de rue. Petit guide pour s’y retrouver."
    groups:
      - title: "Petits prix, grands gobelets"
        text: "Parfaites pour un café glacé à emporter. Peu de places assises en général."
        items:
          - name: "Mega Coffee"
            korean: "메가커피"
          - name: "Compose Coffee"
            korean: "컴포즈커피"
          - name: "Paik’s Coffee"
            korean: "빽다방"
          - name: "Ediya Coffee"
            korean: "이디야커피"
      - title: "Pour s’installer"
        text: "Des salles spacieuses où l’on reste volontiers, pour discuter ou se reposer."
        items:
          - name: "A Twosome Place"
            korean: "투썸플레이스"
            note: "réputée pour ses gâteaux"
          - name: "Hollys"
            korean: "할리스"
          - name: "Tom N Toms"
            korean: "탐앤탐스"
            note: "et ses bretzels"
          - name: "Paul Bassett"
            korean: "폴 바셋"
            note: "café de spécialité et glace au lait"
      - title: "Et Starbucks ?"
        text: "Il y en a partout, avec des boissons de saison et des objets que l’on ne trouve qu’en Corée."
        items: []
  streets:
    title: "Quartiers de cafés"
    items:
      - name: "Seongsu-dong"
        city: "Séoul"
        text: "Anciennes usines devenues cafés et concept stores."
      - name: "Ikseon-dong"
        city: "Séoul"
        text: "Cafés installés dans des maisons traditionnelles."
      - name: "Yeonnam-dong"
        city: "Séoul"
        text: "Petites rues tranquilles près de Hongdae, le long d’un parc."
      - name: "Hwangnidan-gil"
        city: "Gyeongju"
        text: "Cafés et boutiques dans des hanok."
      - name: "Les cafés en bord de mer"
        city: "Jeju"
        text: "Notamment autour de la plage de Woljeong-ri."

boire:
  title: "Boire un verre"
  items:
    - name: "Soju"
      photo: "food/soju.jpg"
      korean: "소주"
      text: "L’alcool national, clair et légèrement sucré, servi en petits verres."
    - name: "Makgeolli"
      photo: "food/makgeolli.jpg"
      korean: "막걸리"
      text: "Alcool de riz laiteux et pétillant, souvent servi avec des galettes (jeon)."
    - name: "Somaek"
      korean: "소맥"
      text: "Le mélange soju et bière, très populaire."
  tips:
    - "On ne se sert pas soi-même : on remplit le verre des autres, qui vous rendront la pareille."
    - "Face à une personne plus âgée, on tient son verre à deux mains et l’on tourne légèrement la tête pour boire."
    - "Les tentes de rue (pojangmacha) et les petites tables devant les supérettes sont typiques des soirées d’été."

regions:
  title: "Spécialités régionales"
  text: "Chaque région a ses plats. Touchez une ville pour découvrir sa page."

adresses:
  title: "Nos adresses"
  items:
    - "À compléter : nos restaurants préférés"
    - "À compléter : nos cafés préférés"
