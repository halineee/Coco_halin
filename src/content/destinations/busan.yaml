order: 4
name: "Busan"
korean: "부산"
tagline: "La mer, les marchés et les collines"
cardText: "La grande ville portuaire du sud : plages, poissons frais et villages colorés."
intro: "Deuxième ville du pays, Busan vit au rythme de la mer : longues plages, marchés aux poissons, temples face aux vagues et maisons colorées accrochées aux collines."

aVoir:
  - name: "Haeundae"
    photo: "destinations/busan/01-haeundae.jpg"
    korean: "해운대"
    text: "La plage la plus célèbre de Corée, et sa promenade le long de la mer."
  - name: "Gamcheon Culture Village"
    photo: "destinations/busan/02-gamcheon.jpg"
    korean: "감천문화마을"
    text: "Un village de maisons pastel en escalier, devenu galerie à ciel ouvert."
  - name: "Haedong Yonggungsa"
    photo: "destinations/busan/03-haedong-yonggungsa.jpg"
    korean: "해동용궁사"
    text: "Un temple bouddhiste posé sur les rochers, face à la mer."
  - name: "Le marché de Jagalchi"
    photo: "destinations/busan/04-jagalchi.jpg"
    korean: "자갈치시장"
    text: "Le plus grand marché aux poissons du pays."

aGouter:
  - name: "Le dwaeji gukbap"
    photo: "food/dwaeji-gukbap.jpg"
    korean: "돼지국밥"
    text: "Soupe de porc et riz, la spécialité réconfortante de Busan."
  - name: "Le milmyeon"
    photo: "food/milmyeon.jpg"
    korean: "밀면"
    text: "Nouilles froides de blé, la version locale du naengmyeon."
  - name: "Les eomuk"
    photo: "food/eomuk.jpg"
    korean: "어묵"
    text: "Galettes de poisson, servies en brochettes dans un bouillon chaud."
  - name: "Les fruits de mer crus"
    korean: "회"
    text: "Choisis au marché, préparés à l’étage dans les petits restaurants."

aFaire:
  - name: "Le train côtier de Haeundae"
    korean: "해운대 블루라인파크"
    text: "Une petite ligne panoramique le long de la côte."
  - name: "Gwangalli le soir"
    photo: "destinations/busan/05-gwangalli.jpg"
    korean: "광안리해수욕장"
    text: "La plage face au pont illuminé, avec ses bars et ses cafés."
  - name: "Huinnyeoul"
    photo: "destinations/busan/06-huinnyeoul.jpg"
    korean: "흰여울문화마을"
    text: "Un village de falaises blanches au-dessus de la mer, idéal pour une balade."

conseils:
  duree: "2 à 3 jours"
  ouLoger: "Haeundae pour la plage, Seomyeon pour la vie locale"
  transport: "KTX depuis Séoul (≈ 2 h 30), puis métro"
  tips:
    - "Les plages sont très fréquentées en août : allez-y tôt le matin."

# Nos suggestions (adresses connues — vérifiez horaires et jours de fermeture)
suggestions:
  - name: "Le marché de Jagalchi"
    korean: "자갈치시장"
    text: "Choisissez votre poisson au rez-de-chaussée, il est préparé à l’étage."
  - name: "Geukdong Dwaeji Gukbap"
    korean: "극동돼지국밥"
    text: "Une soupe de porc au bouillon plus clair, près de Haeundae. Prévoyez un peu d’attente."
  - name: "Subyeon Choego Dwaeji Gukbap"
    korean: "수변최고돼지국밥"
    text: "Une adresse très populaire pour la soupe de porc typique de Busan."

adresses:
