# Destination : Séoul
# Photos : déposez-les dans src/assets/destinations/seoul/ (01.jpg, 02.jpg…).
# La première sert aussi de vignette sur la carte du carnet.
# « adresses » : vos adresses personnelles (restaurants, cafés…).
# Une ligne commençant par « À compléter » s'affiche comme provisoire.
order: 1
name: "Séoul"
korean: "서울"
tagline: "Palais, marchés et gratte-ciel"
cardText: "La capitale, entre palais royaux, ruelles de hanok et quartiers branchés."
intro: "Une ville immense où les palais du XIVe siècle côtoient les tours de verre, où l’on passe d’un marché fumant à une galerie d’art en quelques stations de métro."

aVoir:
  - name: "Gyeongbokgung"
    photo: "destinations/seoul/01-gyeongbokgung.jpg"
    korean: "경복궁"
    text: "Le plus grand des palais royaux, avec la relève de la garde. Entrée gratuite en hanbok."
  - name: "Gwanghwamun et sa place"
    photo: "destinations/seoul/15-gwanghwamun.jpg"
    korean: "광화문광장"
    text: "La grande porte du palais et la place qui s’étend devant elle, avec les statues du roi Sejong et de l’amiral Yi Sun-sin, au pied des tours du centre-ville."
  - name: "Bukchon"
    photo: "destinations/seoul/02-bukchon.jpg"
    korean: "북촌 한옥마을"
    text: "Un quartier de maisons traditionnelles entre deux palais — habité, donc à visiter en silence."
  - name: "Ikseon-dong"
    photo: "destinations/seoul/03-ikseon-dong.jpg"
    korean: "익선동"
    text: "Ruelles de hanok transformées en cafés et petites boutiques."
  - name: "Namsan et la N Seoul Tower"
    photo: "destinations/seoul/04-namsan.jpg"
    korean: "남산"
    text: "La plus belle vue sur la ville, idéalement au coucher du soleil."
  - name: "Changdeokgung et le Jardin secret"
    photo: "destinations/seoul/05-changdeokgung.jpg"
    korean: "창덕궁 · 후원"
    text: "Le plus harmonieux des palais, inscrit à l’UNESCO, et son jardin royal à visiter en visite guidée."
  - name: "Dongdaemun Design Plaza (DDP)"
    photo: "destinations/seoul/06-ddp.jpg"
    korean: "동대문디자인플라자"
    text: "L’immense vaisseau d’aluminium imaginé par Zaha Hadid, entre expositions, design et marchés de nuit."
  - name: "Le Musée national de Corée"
    photo: "destinations/seoul/07-musee-national.jpg"
    korean: "국립중앙박물관"
    text: "Toute l’histoire du pays, des royaumes anciens à nos jours. Collections permanentes gratuites."
  - name: "Le MMCA Séoul"
    photo: "destinations/seoul/08-mmca.jpg"
    korean: "국립현대미술관 서울"
    text: "Le musée national d’art moderne et contemporain, à deux pas du palais Gyeongbokgung."
  - name: "Leeum, musée d’art Samsung"
    photo: "destinations/seoul/09-leeum.jpg"
    korean: "리움미술관"
    text: "Céramiques anciennes et art contemporain dans des bâtiments signés Mario Botta, Jean Nouvel et Rem Koolhaas, à Hannam-dong."
  - name: "Itaewon et Hannam-dong"
    photo: "destinations/seoul/11-itaewon.jpg"
    korean: "이태원 · 한남동"
    text: "Le quartier le plus cosmopolite de Séoul : restaurants du monde entier, bars, boutiques de créateurs et galeries, à deux pas du musée Leeum."
  - name: "Le fleuve Han"
    photo: "destinations/seoul/10-fleuve-han.jpg"
    korean: "한강"
    text: "Pique-nique, vélo et soirées au bord de l’eau, comme les Séoulites. Le soir, la fontaine arc-en-ciel du pont Banpo (반포대교) s’illumine en musique à la belle saison."

aGouter:
  - name: "Le marché de Gwangjang"
    photo: "destinations/seoul/12-gwangjang.jpg"
    korean: "광장시장"
    carte: true
    text: "Galettes de haricot mungo (bindaetteok), kimbap et stands animés."
  - name: "Le barbecue coréen"
    photo: "food/samgyeopsal.jpg"
    korean: "삼겹살"
    text: "Poitrine de porc grillée à table, à envelopper dans une feuille de salade."
  - name: "Le naengmyeon"
    photo: "food/naengmyeon.jpg"
    korean: "냉면"
    text: "Nouilles froides, parfaites en plein mois d’août."

aFaire:
  - name: "Porter le hanbok"
    text: "À louer près des palais, le temps d’une promenade."
  - name: "Seongsu-dong"
    korean: "성수동"
    text: "Anciens ateliers devenus cafés, concept stores et pop-up stores."
  - name: "Myeongdong et Dongdaemun"
    photo: "destinations/seoul/14-myeongdong.jpg"
    korean: "명동 · 동대문"
    text: "Cosmétiques, mode et shopping jusque tard le soir."
  - name: "Un spa coréen (jjimjilbang)"
    text: "Bains, saunas et salles de repos : une expérience très locale."

conseils:
  duree: "4 à 5 jours"
  ouLoger: "Jongno, Myeongdong ou Hongdae (voir la page Hôtels)"
  transport: "Métro et taxi"
  tips:
    - "Beaucoup de musées et palais ferment un jour par semaine (souvent le lundi ou le mardi) : vérifiez avant de partir."
    - "En août, il fait chaud et humide : prévoyez les visites en extérieur le matin."

# Nos suggestions (adresses connues — vérifiez horaires et jours de fermeture)
suggestions:
  - name: "Tosokchon Samgyetang"
    korean: "토속촌 삼계탕"
    text: "Le samgyetang le plus célèbre de Séoul, servi dans des maisons traditionnelles près de Gyeongbokgung. Venez tôt : la file d’attente est légendaire."
  - name: "Myeongdong Kyoja"
    korean: "명동교자"
    text: "Nouilles coupées au couteau (kalguksu) et raviolis, depuis 1966 en plein Myeongdong."
  - name: "Woo Lae Oak"
    korean: "우래옥"
    text: "L’une des plus anciennes tables de Séoul (1946), réputée pour ses nouilles froides de sarrasin et son bulgogi."
  - name: "Hadongkwan"
    korean: "하동관"
    text: "Soupe de bœuf (gomtang) servie depuis 1939. Ouvert le midi seulement."
  - name: "Jinokhwa Halmae Wonjo Dakhanmari"
    korean: "진옥화할매원조닭한마리"
    text: "Le poulet entier cuit à table dans son bouillon, dans une ruelle de Dongdaemun, depuis 1978."
  - name: "Le marché de Gwangjang"
    korean: "광장시장"
    text: "Pour les galettes de haricot mungo, le yukhoe et l’ambiance des stands."

adresses:
  - "À compléter : nos restaurants préférés"
  - "À compléter : nos cafés préférés"
