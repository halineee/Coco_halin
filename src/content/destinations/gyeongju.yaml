order: 3
name: "Gyeongju"
korean: "경주"
tagline: "Le musée à ciel ouvert"
cardText: "L’ancienne capitale du royaume de Silla, entre tumulus, temples et étangs."
intro: "Capitale du royaume de Silla pendant près de mille ans, Gyeongju est une ville paisible où l’on croise des tombes royales en forme de collines au détour d’une rue."

aVoir:
  - name: "Bulguksa"
    photo: "destinations/gyeongju/01-bulguksa.jpg"
    korean: "불국사"
    text: "Le temple le plus célèbre du pays, inscrit au patrimoine mondial de l’UNESCO."
  - name: "La grotte de Seokguram"
    photo: "destinations/gyeongju/02-seokguram.jpg"
    korean: "석굴암"
    text: "Un bouddha de pierre au-dessus de Bulguksa, face à la mer."
  - name: "Daereungwon"
    photo: "destinations/gyeongju/03-daereungwon.jpg"
    korean: "대릉원"
    text: "Un parc de tumulus royaux, comme de grandes collines vertes."
  - name: "Donggung et l’étang de Wolji"
    photo: "destinations/gyeongju/04-donggung-wolji.jpg"
    korean: "동궁과 월지"
    text: "Un ancien palais qui se reflète dans l’eau, magnifique à la nuit tombée."

aGouter:
  - name: "Le chalbori-ppang"
    korean: "찰보리빵"
    text: "Deux petites crêpes moelleuses à l’orge, fourrées de pâte de haricot rouge."
  - name: "Le ssambap"
    photo: "food/ssambap.jpg"
    korean: "쌈밥"
    text: "Riz et multiples accompagnements à envelopper dans des feuilles de salade."
  - name: "Le Gyodong beopju"
    korean: "교동법주"
    text: "Un alcool de riz traditionnel transmis dans la famille Choi de Gyeongju depuis des siècles."

aFaire:
  - name: "Hwangnidan-gil"
    photo: "destinations/gyeongju/05-hwangnidan-gil.jpg"
    korean: "황리단길"
    text: "Une rue de hanok remplie de cafés, de librairies et de boutiques."
  - name: "Le lac de Bomun"
    korean: "보문호"
    text: "Une balade ou un tour à vélo autour du lac, bordé de cerisiers."
  - name: "Louer un vélo"
    text: "La ville est plate et les sites sont proches : idéal à vélo."

conseils:
  duree: "1 à 2 jours"
  ouLoger: "Dans un hanok près de Hwangnidan-gil"
  transport: "KTX jusqu’à Singyeongju (≈ 2 h depuis Séoul), puis bus ou taxi"
  tips:
    - "Facile à combiner avec Busan, à environ une heure de route."

# Nos suggestions (adresses connues — vérifiez horaires et jours de fermeture)
suggestions:
  - name: "Hwangnam-ppang, la boutique historique"
    korean: "황남빵"
    text: "La maison qui a créé le pain de Gyeongju en 1939 : petites pâtisseries fourrées au haricot rouge, à manger dans les jours qui suivent."
  - name: "Le village de Gyochon"
    korean: "교촌마을"
    text: "Le village traditionnel de la famille Choi, berceau du Gyodong beopju, près du pont Woljeonggyo."

adresses:
  - "À compléter : nos adresses à Gyeongju"
