order: 4
name: "Jeonju"
korean: "전주"
tagline: "La capitale de la gastronomie"
cardText: "Un grand village de hanok et la meilleure table du pays, berceau du bibimbap."
hero: "destinations/jeonju.jpg"
intro: "Réputée pour être la ville où l’on mange le mieux en Corée, Jeonju abrite aussi l’un des plus grands quartiers de maisons traditionnelles du pays."

aVoir:
  - name: "Le village de hanok"
    korean: "전주 한옥마을"
    text: "Des centaines de maisons traditionnelles, à parcourir à pied."
  - name: "Gyeonggijeon"
    korean: "경기전"
    text: "Un sanctuaire royal et son jardin de bambous, au cœur du village."
  - name: "La cathédrale de Jeondong"
    korean: "전동성당"
    text: "Une élégante église de brique, l’une des plus anciennes du pays."

aGouter:
  - name: "Le bibimbap de Jeonju"
    korean: "전주비빔밥"
    text: "Le plat emblématique de la ville, servi dans un bol de laiton."
  - name: "Le kongnamul gukbap"
    korean: "콩나물국밥"
    text: "Soupe de pousses de soja et riz, parfaite au petit-déjeuner."
  - name: "Les maisons de makgeolli"
    korean: "막걸리 골목"
    text: "On commande une bouilloire de makgeolli, et les petits plats arrivent avec."

aFaire:
  - name: "Se promener en hanbok"
    text: "Le village de hanok s’y prête particulièrement."
  - name: "Le marché de nuit de Nambu"
    text: "Stands de street food et ambiance animée le week-end."

conseils:
  duree: "1 jour (possible en aller-retour depuis Séoul)"
  ouLoger: "Une nuit dans un hanok du village"
  transport: "KTX (≈ 1 h 30 à 2 h) ou bus express depuis Séoul"
  tips:
    - "Le village est très fréquenté le week-end : préférez un jour de semaine."

adresses:
  - "À compléter : nos adresses à Jeonju"
